<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Propiedad
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="card col-md-6">
                <div class="card-body p-4">

                    <h1 class="card-title text-center mb-4"
                        th:text="${formBean.id == null} ? 'Nueva Propiedad' : 'Editar Propiedad'"></h1>

                    <form th:action="@{/propiedadesEditar}" th:object="${formBean}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">
                                Dirección
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{direccion}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Ciudad
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text" class="form-control" th:field="*{ciudad}" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Tipo de Propiedad
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" th:field="*{tipo}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Cantidad de Ambientes
                                <span class="text-danger">*</span>
                            </label>
                            <input type="number" class="form-control" th:field="*{cantidadAmbientes}" min="1"
                                required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Metros Cuadrados
                                <span class="text-danger">*</span>
                            </label>
                            <input type="number" step="0.01" class="form-control" th:field="*{metrosCuadrados}"
                                min="0.01" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Disponibilidad
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" th:field="*{estadoDisponibilidad}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Propietario
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select" th:field="*{propietarioId}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="persona : ${personas}" th:value="${persona.id}"
                                    th:text="${persona.nombre} + ' ' + ${persona.apellido}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Descripción
                                <span class="text-danger">*</span>
                            </label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/propiedadesBuscar}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                            <button type="submit" name="action" value="actionAceptar" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
