<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="card-title text-center mb-4"
                            th:text="${formBean.id == null} ? 'Nueva Factura' : 'Editar Factura'"></h1>

                        <div th:if="${#fields.hasErrors()}" class="alert alert-danger">
                            <ul>
                                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
                            </ul>
                        </div>

                        <form th:action="@{/facturasEditar}" th:object="${formBean}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Contrato <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{contrato.id}" required>
                                    <option value="">Seleccionar...</option>
                                    <option th:each="c : ${contratos}" th:value="${c.id}"
                                        th:text="${c.propiedad.direccion} + ' - ' + ${c.inquilino.nombreCompleto}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Concepto <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{concepto}" required />
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Fecha Emisión <span
                                                class="text-danger">*</span></label>
                                        <input type="date" class="form-control" th:field="*{fechaEmision}" required />
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">Fecha Vencimiento <span
                                                class="text-danger">*</span></label>
                                        <input type="date" class="form-control" th:field="*{fechaVencimiento}"
                                            required />
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Importe <span class="text-danger">*</span></label>
                                <input type="number" step="100" class="form-control" th:field="*{importe}" required />
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Estado <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{estadoFactura}" required>
                                    <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}">
                                    </option>
                                </select>
                            </div>

                            <!-- Datos de pago (se muestran solo si está Pagada) -->
                            <div class="card bg-light p-3 mb-3" th:if="${formBean.estadoFactura.name() == 'Pagada'}">
                                <h6 class="mb-3"><i class="fas fa-credit-card"></i> Datos de Pago</h6>

                                <div class="mb-3">
                                    <label class="form-label">Fecha Pago</label>
                                    <input type="date" class="form-control" th:field="*{fechaPago}" />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Medio de Pago</label>
                                    <select class="form-select" th:field="*{medioPago}">
                                        <option value="">Seleccionar...</option>
                                        <option th:each="medio : ${mediosPago}" th:value="${medio}" th:text="${medio}">
                                        </option>
                                    </select>
                                </div>

                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">Importe Pagado</label>
                                            <input type="number" step="100" class="form-control"
                                                th:field="*{importePagado}" />
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="mb-3">
                                            <label class="form-label">Interés</label>
                                            <input type="number" step="100" class="form-control"
                                                th:field="*{interes}" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/facturasBuscar}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Volver
                                </a>
                                <button type="submit" name="action" value="actionAceptar" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Guardar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
