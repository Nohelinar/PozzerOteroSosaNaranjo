<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <h1 class="mb-4">
            <i class="fas fa-tools text-primary"></i> Incidentes
        </h1>

        <div class="card shadow-sm">
            <div class="card-body text-center py-5">
                <i class="fas fa-hard-hat fa-5x text-warning mb-4"></i>
                <h2 class="display-6">🚧 En Construcción</h2>
                <p class="lead text-muted">El módulo de Incidentes está en desarrollo.</p>
                <p class="text-muted">Próximamente podrás gestionar reclamos y mantenimientos.</p>
                <hr class="w-25 mx-auto">
                <a th:href="@{/}" class="btn btn-primary mt-3">
                    <i class="fas fa-arrow-left"></i> Volver al Inicio
                </a>
            </div>
        </div>

        <div class="mt-4 text-center">
            <span class="badge bg-info text-dark">
                <i class="fas fa-code"></i> Versión 1.0 - En desarrollo
            </span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
