<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Contratos
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <h1 class="mb-4">
            Contratos
        </h1>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${warning}" class="alert alert-warning" th:text="${warning}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">
                    Búsqueda
                </h5>

                <form th:action="@{/contratosBuscar}" th:object="${formBean}" method="post">
                    <div class="row g-3">

                        <div class="col-md-3">
                            <label class="form-label">
                                Propiedad
                            </label>
                            <select class="form-select" th:field="*{propiedadId}">
                                <option value="">
                                    Todas
                                </option>
                                <option th:each="prop : ${propiedades}" th:value="${prop.id}"
                                    th:text="${prop.direccion} + ' - ' + ${prop.ciudad}"></option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">
                                Inquilino
                            </label>
                            <select class="form-select" th:field="*{inquilinoId}">
                                <option value="">
                                    Todos
                                </option>
                                <option th:each="persona : ${personas}" th:value="${persona.id}"
                                    th:text="${persona.nombreCompleto}"></option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">
                                Estado
                            </label>
                            <select class="form-select" th:field="*{estado}">
                                <option value="">
                                    Todos
                                </option>
                                <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label">
                                Fecha Inicio
                            </label>
                            <input type="date" class="form-control" th:field="*{fechaInicio}" />
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-0">
                            <button type="submit" name="action" value="actionBuscar" class="btn btn-primary">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>

        <!-- Tabla de resultados -->
        <div class="table-responsive">
            <table class="table table-bordered border-Light table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Propiedad</th>
                        <th>Propietario</th>
                        <th>Inquilino</th>
                        <th>Fecha Inicio</th>
                        <th>Importe</th>
                        <th>Día Venc.</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${resultados == null or resultados.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="fas fa-info-circle"></i> Los resultados se mostrarán aquí
                        </td>
                    </tr>
                    <tr th:each="c : ${resultados}">
                        <td th:text="${c.id}"></td>
                        <td th:text="${c.propiedad.direccion}"></td>
                        <td th:text="${c.propietario.nombreCompleto}"></td>
                        <td th:text="${c.inquilino.nombreCompleto}"></td>
                        <td th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy')}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(c.importeMensual, 0, 0, 'COMMA')}"></td>
                        <td th:text="${c.diaVencimientoMensual}"></td>
                        <td>
                            <span class="badge"
                                th:class="${c.estadoContrato.name() == 'Activo' ? 'bg-success' : 
                                                           c.estadoContrato.name() == 'Borrador' ? 'bg-secondary' : 
                                                           c.estadoContrato.name() == 'Finalizado' ? 'bg-info' : 'bg-danger'}"
                                th:text="${c.estadoContrato}">
                            </span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/contratosEditar/{id}(id=${c.id})}" class="btn btn-primary btn-sm me-1"
                                title="Editar">
                                <i class="fas fa-pencil-alt"></i>
                            </a>
                            <form th:action="@{/contratosEditar/delete/{id}(id=${c.id})}" method="post"
                                style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Está seguro de eliminar este contrato?')"
                                    title="Eliminar">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4 d-flex justify-content-between">
            <a th:href="@{/}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Ir a Inicio
            </a>
            <a th:href="@{/contratosEditar}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nuevo Contrato
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
