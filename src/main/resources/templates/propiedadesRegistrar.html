
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Propiedad</title>
    <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

    <h1>Registrar Propiedad</h1>

    <div th:if="${error}" class="mensaje-error">
        <span th:text="${error}"></span>
    </div>

    <form class="formulario-edicion"
          action="#"
          th:action="@{/propiedades/registrar}"
          method="post"
          th:object="${propiedad}">

        <p>
            <label>Dirección:</label>
            <input type="text" th:field="*{direccion}" required>
        </p>

        <p>
            <label>Ciudad:</label>
            <input type="text" th:field="*{ciudad}" required>
        </p>

        <p>
            <label>Tipo de propiedad:</label>
            <select th:field="*{tipoPropiedad}" required>
                <option value="">Seleccione</option>
                <option th:each="tipo : ${tiposPropiedad}"
                        th:value="${tipo}"
                        th:text="${tipo}">
                </option>
            </select>
        </p>

        <p>
            <label>Cantidad de ambientes:</label>
            <input type="number" th:field="*{cantidadAmbientes}" min="1" required>
        </p>

        <p>
            <label>Metros cuadrados:</label>
            <input type="number" step="0.01" th:field="*{metrosCuadrados}" min="0.01" required>
        </p>

        <p>
            <label>Descripción:</label><br>
            <textarea th:field="*{descripcion}" rows="4" cols="60" required></textarea>
        </p>

        <p>
            <label>Estado:</label>
            <select th:field="*{estadoPropiedad}" required>
                <option th:each="estado : ${estadosPropiedad}"
                        th:value="${estado}"
                        th:text="${estado}">
                </option>
            </select>
        </p>

        <p>
            <label>Propietario:</label>
            <select th:field="*{propietario.id}" required>
                <option value="">Seleccione</option>
                <option th:each="persona : ${personas}"
                        th:value="${persona.id}"
                        th:text="${persona.nombre + ' ' + persona.apellido}">
                </option>
            </select>
        </p>

        <button type="submit">Guardar</button>
        <a href="/propiedades/buscar" th:href="@{/propiedades/buscar}" class="boton">Volver</a>

    </form>

</div>

</body>
</html>
