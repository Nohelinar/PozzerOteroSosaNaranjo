<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Editar Contrato</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

	<h1>Editar Contrato</h1>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form class="formulario-edicion"
		  action="#"
		  th:action="@{/contratos/editar/{id}(id=${contrato.id})}"
		  method="post"
		  th:object="${contrato}">

		<p>
			<label>ID:</label>
			<span th:text="${contrato.id}"></span>
		</p>

		<p>
			<label>Propiedad:</label>
			<select th:field="*{propiedad}" required>
				<option th:each="p : ${propiedades}"
						th:value="${p.id}"
						th:text="${p.direccion}">
				</option>
			</select>
		</p>

		<p>
			<label>Inquilino:</label>
			<select th:field="*{inquilino}" required>
				<option th:each="p : ${personas}"
						th:value="${p.id}"
						th:text="${p.nombre + ' ' + p.apellido}">
				</option>
			</select>
		</p>

		<p>
			<label>Fecha de inicio:</label>
			<input type="date" th:field="*{fechaInicio}" required>
		</p>

		<p>
			<label>Duración (meses):</label>
			<input type="number" th:field="*{duracionMeses}" min="1" required>
		</p>

		<p>
			<label>Importe mensual:</label>
			<input type="number" step="0.01" th:field="*{importeMensual}" min="0.01" required>
		</p>

		<p>
			<label>Día de vencimiento mensual:</label>
			<input type="number" th:field="*{diaVencimientoMensual}" min="1" max="31" required>
		</p>

		<p>
			<label>Descripción:</label><br>
			<textarea th:field="*{descripcion}" rows="4" cols="60" required></textarea>
		</p>

		<p>
			<label>Estado:</label>
			<select th:field="*{estado}" required>
				<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoContrato).values()}"
						th:value="${e}"
						th:text="${e}">
				</option>
			</select>
		</p>

		<button type="submit">Guardar</button>
		<a href="/contratos/listado" th:href="@{/contratos/listado}" class="boton">Volver</a>

	</form>

</div>

</body>
</html>
