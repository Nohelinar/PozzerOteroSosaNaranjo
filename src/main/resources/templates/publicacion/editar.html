<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Editar Publicación</title>
</head>

<body>
	<p th:if="${error}" th:text="${error}"></p>
	<form th:action="@{/publicaciones/editar/{id}(id=${publicacion.id})}" th:object="${publicacion}" method="post">
		<label>Propiedad:</label>
		<span th:text="${publicacion.propiedad.direccion + ' - ' + publicacion.propiedad.ciudad}"></span>
		<!-- La propiedad asociada es de solo lectura una vez creada la publicación -->
		<br />

		<label>Precio mensual:</label>
		<input type="number" th:field="*{precioMensual}" step="0.01" /><br />

		<label>Condiciones de alquiler:</label>
		<textarea th:field="*{condicionesAlquiler}"></textarea><br />

		<label>Descripción:</label>
		<textarea th:field="*{descripcion}"></textarea><br />

		<label>Fecha de publicación:</label>
		<input type="date" th:field="*{fechaPublicacion}" /><br />

		<label>Estado:</label>
		<select th:field="*{estado}">
			<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoPublicacion).values()}"
				th:value="${e}" th:text="${e}"></option>
		</select> <br />

		<button type="submit">Guardar</button>
	</form>

</body>

</html>
