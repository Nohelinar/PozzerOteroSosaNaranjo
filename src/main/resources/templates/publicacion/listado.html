<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Listado de Publicaciones</title>
</head>

<body>

	<p th:if="${error}" th:text="${error}"></p>

	<h1>Listado de Publicaciones</h1>

	<a th:href="@{/}">Inicio</a>

	<form th:action="@{/publicaciones/listado}" method="get">
		<select name="estado">
			<option value="">Todos</option>
			<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoPublicacion).values()}"
				th:value="${e}" th:text="${e}" th:selected="${e == estado}"></option>
		</select>
		<select name="propiedadId">
			<option value="" th:selected="${propiedadId == null}">Todas</option>
			<option th:each="p : ${propiedades}" th:value="${p.id}" th:text="${p.direccion}"
				th:selected="${p.id == propiedadId}"></option>
		</select>
		<input type="text" name="ciudad" placeholder="Ciudad" th:value="${ciudad}" />
		<input type="number" name="precioDesde" step="0.01" placeholder="Precio desde" th:value="${precioDesde}" />
		<input type="number" name="precioHasta" step="0.01" placeholder="Precio hasta" th:value="${precioHasta}" />
		<button type="submit">Filtrar</button>
	</form>

	<table border="1">
		<thead>
			<tr>
				<th>Id</th>
				<th>Dirección</th>
				<th>Ciudad</th>
				<th>Precio Mensual</th>
				<th>Fecha Publicación</th>
				<th>Estado</th>
				<th>Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="publicacion : ${publicaciones}">
				<td th:text="${publicacion.id}"></td>
				<td th:text="${publicacion.propiedad.direccion}"></td>
				<td th:text="${publicacion.propiedad.ciudad}"></td>
				<td th:text="${publicacion.precioMensual}"></td>
				<td th:text="${publicacion.fechaPublicacion}"></td>
				<td th:text="${publicacion.estado}"></td>
				<td>
					<a th:href="@{/publicaciones/editar/{id}(id=${publicacion.id})}">Editar</a>

					<form th:action="@{/publicaciones/eliminar/{id}(id=${publicacion.id})}" method="post"
						style="display:inline">
						<button type="submit">Eliminar</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>

</html>
