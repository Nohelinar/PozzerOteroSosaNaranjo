<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Publicaciones</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>

<body>

<div class="contenedor">

	<h1>Publicaciones</h1>

	<a th:href="@{/}" class="boton">Inicio</a>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form th:action="@{/publicaciones/listado}" method="get">

		<div>
			<label>Estado</label>
			<select name="estado">
				<option value="">Todos</option>
				<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoPublicacion).values()}"
						th:value="${e}"
						th:text="${e}"
						th:selected="${e == estado}">
				</option>
			</select>
		</div>

		<div>
			<label>Propiedad</label>
			<select name="propiedadId">
				<option value="" th:selected="${propiedadId == null}">Todas</option>
				<option th:each="p : ${propiedades}"
						th:value="${p.id}"
						th:text="${p.direccion}"
						th:selected="${p.id == propiedadId}">
				</option>
			</select>
		</div>

		<div>
			<label>Ciudad</label>
			<input type="text"
				   name="ciudad"
				   placeholder="Ciudad"
				   th:value="${ciudad}" />
		</div>

		<div>
			<label>Precio Desde</label>
			<input type="number"
				   name="precioDesde"
				   step="0.01"
				   placeholder="Precio desde"
				   th:value="${precioDesde}" />
		</div>

		<div>
			<label>Precio Hasta</label>
			<input type="number"
				   name="precioHasta"
				   step="0.01"
				   placeholder="Precio hasta"
				   th:value="${precioHasta}" />
		</div>

		<button type="submit">Filtrar</button>
		<a th:href="@{/publicaciones/listado}" class="boton">Cancelar</a>

	</form>

	<table>
		<thead>
		<tr>
			<th>Id</th>
			<th>Dirección</th>
			<th>Ciudad</th>
			<th>Precio Mensual</th>
			<th>Fecha Publicación</th>
			<th>Estado</th>
			<th></th>
			<th></th>
		</tr>
		</thead>

		<tbody>
		<tr th:each="publicacion : ${publicaciones}">
			<td th:text="${publicacion.id}"></td>
			<td th:text="${publicacion.propiedad.direccion}"></td>
			<td th:text="${publicacion.propiedad.ciudad}"></td>
			<td th:text="${publicacion.precioMensual}"></td>
			<td th:text="${publicacion.fechaPublicacion}"></td>
			<td th:text="${publicacion.estado}"></td>

			<td>
				<a th:href="@{/publicaciones/editar/{id}(id=${publicacion.id})}" class="boton">Editar</a>
			</td>

			<td>
				<form th:action="@{/publicaciones/eliminar/{id}(id=${publicacion.id})}"
					  method="post"
					  onsubmit="return confirm('¿Confirma la eliminación de la publicación?');">
					<button type="submit">Eliminar</button>
				</form>
			</td>

		</tr>
		</tbody>
	</table>

	<p th:if="${publicaciones == null or publicaciones.isEmpty()}">
		No se encontraron publicaciones.
	</p>

</div>

</body>
</html>
