<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Alta de Publicación</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

	<h1>Nueva Publicación</h1>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form class="formulario-edicion"
		  action="#"
		  th:action="@{/publicaciones/alta}"
		  method="post"
		  th:object="${publicacion}">

		<p>
			<label>Propiedad:</label>
			<select th:field="*{propiedad}" required>
				<option value="">Seleccione</option>
				<option th:each="p : ${propiedades}"
						th:value="${p.id}"
						th:text="${p.direccion + ' - ' + p.ciudad}">
				</option>
			</select>
		</p>

		<p>
			<label>Precio mensual:</label>
			<input type="number" step="0.01" th:field="*{precioMensual}" min="0.01" required>
		</p>

		<p>
			<label>Condiciones de alquiler:</label><br>
			<textarea th:field="*{condicionesAlquiler}" rows="4" cols="60" required></textarea>
		</p>

		<p>
			<label>Descripción:</label><br>
			<textarea th:field="*{descripcion}" rows="4" cols="60" required></textarea>
		</p>

		<p>
			<label>Fecha de publicación:</label>
			<input type="date" th:field="*{fechaPublicacion}" required>
		</p>

		<p>
			<label>Estado:</label>
			<select th:field="*{estado}" required>
				<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoPublicacion).values()}"
						th:value="${e}"
						th:text="${e}">
				</option>
			</select>
		</p>

		<button type="submit">Guardar</button>
		<a href="/publicaciones/listado" th:href="@{/publicaciones/listado}" class="boton">Volver</a>

	</form>

</div>

</body>
</html>
