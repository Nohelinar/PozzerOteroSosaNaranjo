<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Registrar Persona</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

	<h1>Registrar Persona</h1>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form class="formulario-edicion"
		  action="#"
		  th:action="@{/personas/alta}"
		  method="post"
		  th:object="${persona}">

		<p>
			<label>Nombre:</label>
			<input type="text" th:field="*{nombre}" required>
		</p>

		<p>
			<label>Apellido:</label>
			<input type="text" th:field="*{apellido}" required>
		</p>

		<p>
			<label>DNI/CUIT:</label>
			<input type="text" th:field="*{dniCuit}" required>
		</p>

		<p>
			<label>Teléfono:</label>
			<input type="text" th:field="*{telefono}">
		</p>

		<p>
			<label>Email:</label>
			<input type="email" th:field="*{email}">
		</p>

		<p>
			<label>Domicilio:</label>
			<input type="text" th:field="*{domicilio}">
		</p>

		<p>
			<label>Ciudad:</label>
			<select th:field="*{ciudad.id}">
				<option value="">Sin especificar</option>
				<option th:each="c : ${ciudades}"
						th:value="${c.id}"
						th:text="${c.nombre + (c.provincia != null ? ' (' + c.provincia.nombre + ')' : '')}">
				</option>
			</select>
		</p>

		<button type="submit">Guardar</button>
		<a href="/personas/listado" th:href="@{/personas/listado}" class="boton">Volver</a>

	</form>

</div>

</body>
</html>
