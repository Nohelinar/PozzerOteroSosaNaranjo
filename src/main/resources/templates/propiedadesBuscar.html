<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Propiedades
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <h1 class="mb-4">
            Propiedades
        </h1>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${warning}" class="alert alert-warning" th:text="${warning}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">
                    Búsqueda
                </h5>

                <form th:action="@{/propiedadesBuscar}" th:object="${formBean}" method="post">
                    <div class="row g-3">

                        <div class="col-md-3">
                            <label for="direccion" class="form-label">
                                Dirección
                            </label>
                            <input type="text" class="form-control" th:field="*{direccion}"
                                placeholder="Buscar por dirección" id="direccion" />
                        </div>

                        <div class="col-md-3">
                            <label for="ciudad" class="form-label">
                                Ciudad
                            </label>
                            <input type="text" class="form-control" th:field="*{ciudad}" placeholder="Buscar por ciudad"
                                id="ciudad" />
                        </div>

                        <div class="col-md-3">
                            <label for="tipo" class="form-label">
                                Tipo
                            </label>
                            <select class="form-select" th:field="*{tipo}" id="tipo">
                                <option value="">Todos</option>
                                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="estado" class="form-label">
                                Disponibilidad
                            </label>
                            <select class="form-select" th:field="*{estado}" id="estado">
                                <option value="">Todos</option>
                                <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
                            </select>
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-0">
                            <button type="submit" name="action" value="actionBuscar" class="btn btn-primary">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de resultados -->
        <div class="table-responsive">
            <table class="table table-bordered border-Light table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Dirección</th>
                        <th>Ciudad</th>
                        <th>Tipo</th>
                        <th>Ambientes</th>
                        <th>M²</th>
                        <th>Estado</th>
                        <th>Propietario</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${resultados == null or resultados.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="fas fa-info-circle"></i> Los resultados se mostrarán aquí
                        </td>
                    </tr>
                    <tr th:each="propiedad : ${resultados}">
                        <td th:text="${propiedad.id}"></td>
                        <td th:text="${propiedad.direccion}"></td>
                        <td th:text="${propiedad.ciudad}"></td>
                        <td th:text="${propiedad.tipo}"></td>
                        <td th:text="${propiedad.cantidadAmbientes}"></td>
                        <td th:text="${propiedad.metrosCuadrados}"></td>
                        <td>
                            <span class="badge"
                                th:class="${propiedad.estadoDisponibilidad.name() == 'Disponible' ? 'bg-success' : 
                                   propiedad.estadoDisponibilidad.name() == 'Reservada' ? 'bg-warning text-dark' : 
                                   propiedad.estadoDisponibilidad.name() == 'Alquilada' ? 'bg-danger' : 
                                   propiedad.estadoDisponibilidad.name() == 'Inactiva' ? 'bg-secondary' : 'bg-secondary'}"
                                th:text="${propiedad.estadoDisponibilidad}">
                            </span>
                        </td>
                        <td th:text="${propiedad.propietario.nombreCompleto}"></td>
                        <td class="text-center">
                            <a th:href="@{/propiedadesEditar/{id}(id=${propiedad.id})}"
                                class="btn btn-primary btn-sm me-1" title="Editar">
                                <i class="fas fa-pencil-alt"></i>
                            </a>

                            <form th:action="@{/propiedadesEditar/delete/{id}(id=${propiedad.id})}" method="post"
                                style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Está seguro de eliminar esta propiedad?')"
                                    title="Eliminar">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Botones de acción -->
        <div class="mt-4 d-flex justify-content-between">
            <a th:href="@{/}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Ir a Inicio
            </a>
            <a th:href="@{/propiedadesEditar}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nueva Propiedad
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
