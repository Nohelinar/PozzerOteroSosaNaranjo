<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Facturas
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <h1 class="mb-4">
            Facturas
        </h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${warning}" class="alert alert-warning" th:text="${warning}"></div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">
                    Búsqueda
                </h5>

                <form th:action="@{/facturasBuscar}" th:object="${formBean}" method="post">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Contrato</label>
                            <select class="form-select" th:field="*{contratoId}">
                                <option value="">Todos</option>
                                <option th:each="c : ${contratos}" th:value="${c.id}"
                                    th:text="${c.propiedad.direccion} + ' - ' + ${c.inquilino.nombreCompleto}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Propiedad</label>
                            <select class="form-select" th:field="*{propiedadId}">
                                <option value="">Todas</option>
                                <option th:each="prop : ${propiedades}" th:value="${prop.id}"
                                    th:text="${prop.direccion}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Inquilino</label>
                            <select class="form-select" th:field="*{inquilinoId}">
                                <option value="">Todos</option>
                                <option th:each="p : ${personas}" th:value="${p.id}" th:text="${p.nombreCompleto}">
                                </option>
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Estado</label>
                            <select class="form-select" th:field="*{estado}">
                                <option value="">Todos</option>
                                <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Fecha Vencimiento Desde</label>
                            <input type="date" class="form-control" th:field="*{fechaVencimientoDesde}" />
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Fecha Vencimiento Hasta</label>
                            <input type="date" class="form-control" th:field="*{fechaVencimientoHasta}" />
                        </div>

                        <div class="col-12 d-flex justify-content-end gap-0">
                            <button type="submit" name="action" value="actionBuscar" class="btn btn-primary">
                                <i class="fas fa-search"></i> Buscar
                            </button>
                        </div>
                    </div>
                </form>

            </div>
        </div>

        <!-- Tabla de resultados -->
        <div class="table-responsive">
            <table class="table table-bordered border-Light table-striped table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Contrato</th>
                        <th>Propiedad</th>
                        <th>Inquilino</th>
                        <th>Concepto</th>
                        <th>Importe</th>
                        <th>Vencimiento</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${resultados == null or resultados.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="fas fa-info-circle"></i> No hay facturas registradas
                        </td>
                    </tr>
                    <tr th:each="f : ${resultados}">
                        <td th:text="${f.id}"></td>
                        <td th:text="${f.contrato.propiedad.direccion}"></td>
                        <td th:text="${f.contrato.propiedad.direccion}"></td>
                        <td th:text="${f.contrato.inquilino.nombreCompleto}"></td>
                        <td th:text="${f.concepto}"></td>
                        <td th:text="${'$' + #numbers.formatDecimal(f.importe, 0, 0, 'COMMA')}"></td>
                        <td th:text="${#temporals.format(f.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span class="badge" th:class="${f.estadoFactura.name() == 'Pendiente' ? 'bg-warning' : 
                                f.estadoFactura.name() == 'Pagada' ? 'bg-success' : 
                                f.estadoFactura.name() == 'Vencida' ? 'bg-danger' : 'bg-secondary'}"
                                th:text="${f.estadoFactura}">
                            </span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/facturasEditar/{id}(id=${f.id})}" class="btn btn-primary btn-sm me-1"
                                title="Editar">
                                <i class="fas fa-pencil-alt"></i>
                            </a>
                            <form th:action="@{/facturasEditar/delete/{id}(id=${f.id})}" method="post"
                                style="display:inline">
                                <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Está seguro de eliminar esta factura?')" title="Eliminar">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-4 d-flex justify-content-between">
            <a th:href="@{/}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Ir a Inicio
            </a>
            <a th:href="@{/contratosEditar}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Agregar Nueva Factura
            </a>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
