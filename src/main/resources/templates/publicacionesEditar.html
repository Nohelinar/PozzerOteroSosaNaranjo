<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Publicación
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="card col-md-6">
                <div class="card-body p-4">

                    <h1 class="card-title text-center mb-4"
                        th:text="${formBean.id == null} ? 'Nueva Publicación' : 'Editar Publicación'"></h1>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/publicacionesEditar}" th:object="${formBean}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">
                                Propiedad <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{propiedadId}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="prop : ${propiedades}" th:value="${prop.id}"
                                    th:text="${prop.direccion} + ' - ' + ${prop.ciudad}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Precio Mensual <span class="text-danger">*</span></label>
                            <input type="number" step="1000" class="form-control" th:field="*{precioMensual}"
                                required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Estado <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{estadoPublicacion}" required>
                                <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Condiciones <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{condiciones}" rows="2" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Descripción <span class="text-danger">*</span></label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3" required></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/propiedadesBuscar}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                            <button type="submit" name="action" value="actionAceptar" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
