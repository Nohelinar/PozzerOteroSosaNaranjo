<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Ciudad</title>
    <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

    <h1>Nueva Ciudad</h1>

    <div th:if="${error}" class="mensaje-error">
        <span th:text="${error}"></span>
    </div>

    <p th:if="${provincias == null or provincias.isEmpty()}" class="mensaje-error">
        Todavía no hay provincias cargadas.
        <a href="/provincias/alta" th:href="@{/provincias/alta}">Crear una provincia primero</a>.
    </p>

    <form class="formulario-edicion"
          action="#"
          th:action="@{/ciudades/alta}"
          method="post"
          th:object="${ciudad}">

        <p>
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required>
        </p>

        <p>
            <label>Provincia:</label>
            <select th:field="*{provincia}" required>
                <option value="">Seleccione</option>
                <option th:each="p : ${provincias}"
                        th:value="${p.id}"
                        th:text="${p.nombre}">
                </option>
            </select>
        </p>

        <button type="submit">Guardar</button>
        <a href="/ciudades/listado" th:href="@{/ciudades/listado}" class="boton">Volver</a>

    </form>

</div>

</body>
</html>
