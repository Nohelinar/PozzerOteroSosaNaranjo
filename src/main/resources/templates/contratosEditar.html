<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="p-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="card col-md-6">
                <div class="card-body p-4">

                    <h1 class="card-title text-center mb-4"
                        th:text="${formBean.id == null} ? 'Nuevo Contrato' : 'Editar Contrato'"></h1>

                    <form th:action="@{/contratosEditar}" th:object="${formBean}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label">Propiedad <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{propiedad.id}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="prop : ${propiedades}" th:value="${prop.id}"
                                    th:text="${prop.direccion} + ' - ' + ${prop.ciudad}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Propietario <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{propietario.id}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="persona : ${personas}" th:value="${persona.id}"
                                    th:text="${persona.nombreCompleto}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Inquilino <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{inquilino.id}" required>
                                <option value="">Seleccionar...</option>
                                <option th:each="persona : ${personas}" th:value="${persona.id}"
                                    th:text="${persona.nombreCompleto}"></option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Fecha Inicio <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" th:field="*{fechaInicio}" required />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Duración (meses) <span
                                            class="text-danger">*</span></label>
                                    <input type="number" class="form-control" th:field="*{duracionMeses}" min="1"
                                        required />
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Importe Mensual <span class="text-danger">*</span></label>
                                    <input type="number" step="1000" class="form-control" th:field="*{importeMensual}"
                                        required />
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Día Vencimiento <span class="text-danger">*</span></label>
                                    <input type="number" class="form-control" th:field="*{diaVencimientoMensual}"
                                        min="1" max="31" required />
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{estadoContrato}" required>
                                <option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="2"></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/contratosBuscar}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                            <button type="submit" name="action" value="actionAceptar" class="btn btn-primary">
                                <i class="fas fa-save"></i> Guardar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
