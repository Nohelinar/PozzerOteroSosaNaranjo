<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Visita</title>
    <link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

    <h1>Editar Visita</h1>

    <div th:if="${error}" class="mensaje-error">
        <span th:text="${error}"></span>
    </div>

    <form class="formulario-edicion"
          action="#"
          th:action="@{/visitas/editar/{id}(id=${visita.id})}"
          method="post"
          th:object="${visita}">

        <p>
            <label>ID:</label>
            <span th:text="${visita.id}"></span>
        </p>

        <p>
            <label>Publicación:</label>
            <span th:text="${visita.publicacion.propiedad.direccion}"></span>
            <!-- La publicación asociada es de solo lectura una vez creada la visita -->
        </p>

        <p>
            <label>Fecha y hora:</label>
            <input type="datetime-local" th:field="*{fechaHora}" required>
        </p>

        <p>
            <label>Estado:</label>
            <select th:field="*{estado}" required>
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
            </select>
        </p>

        <button type="submit">Guardar</button>
        <a href="/visitas/listado" th:href="@{/visitas/listado}" class="boton">Volver</a>

    </form>

</div>

</body>
</html>
