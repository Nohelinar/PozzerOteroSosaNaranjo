<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Editar Factura</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

	<h1>Editar Factura</h1>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form class="formulario-edicion"
		  action="#"
		  th:action="@{/facturas/editar/{id}(id=${factura.id})}"
		  method="post"
		  th:object="${factura}">

		<p>
			<label>ID:</label>
			<span th:text="${factura.id}"></span>
		</p>

		<p>
			<label>Contrato:</label>
			<span th:text="${factura.contrato.propiedad.direccion + ' - ' + factura.contrato.inquilino.nombre}"></span>
			<!-- El contrato asociado a una factura ya creada es de solo lectura -->
		</p>

		<p>
			<label>Concepto facturado:</label>
			<input type="text" th:field="*{concepto}" required>
		</p>

		<p>
			<label>Fecha de emisión:</label>
			<input type="date" th:field="*{fechaEmision}" required>
		</p>

		<p>
			<label>Fecha de vencimiento:</label>
			<input type="date" th:field="*{fechaVencimiento}" required>
		</p>

		<p>
			<label>Importe:</label>
			<input type="number" step="0.01" th:field="*{importe}" min="0.01" required>
		</p>

		<p>
			<label>Estado:</label>
			<select th:field="*{estado}" required>
				<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoFactura).values()}"
						th:value="${e}"
						th:text="${e}">
				</option>
			</select>
		</p>

		<fieldset>
			<legend>Datos de pago (completar solo si el estado pasa a "PAGADA")</legend>

			<p>
				<label>Fecha de pago:</label>
				<input type="date" th:field="*{fechaPago}">
			</p>

			<p>
				<label>Medio de pago:</label>
				<select th:field="*{medioPago}">
					<option value="">-</option>
					<option th:each="m : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.MedioPago).values()}"
							th:value="${m}"
							th:text="${m}">
					</option>
				</select>
			</p>

			<p>
				<label>Importe pagado:</label>
				<input type="number" step="0.01" th:field="*{importePagado}">
			</p>

			<p>
				<label>Interés pagado:</label>
				<input type="number" step="0.01" th:field="*{interesPagado}">
			</p>
		</fieldset>

		<button type="submit">Guardar</button>
		<a href="/facturas/listado" th:href="@{/facturas/listado}" class="boton">Volver</a>

	</form>

</div>

</body>
</html>
