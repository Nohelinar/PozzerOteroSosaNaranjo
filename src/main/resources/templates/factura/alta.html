<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Alta de Factura</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>
<body>

<div class="contenedor">

	<h1>Nueva Factura</h1>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form class="formulario-edicion"
		  action="#"
		  th:action="@{/facturas/alta}"
		  method="post"
		  th:object="${factura}">

		<p>
			<label>Contrato:</label>
			<select th:field="*{contrato}" required>
				<option value="">Seleccione</option>
				<option th:each="c : ${contratos}"
						th:value="${c.id}"
						th:text="${c.propiedad.direccion + ' - ' + c.inquilino.nombre}">
				</option>
			</select>
		</p>

		<p>
			<label>Concepto facturado:</label>
			<input type="text" th:field="*{concepto}" required>
		</p>

		<p>
			<label>Fecha de emisión:</label>
			<input type="date" th:field="*{fechaEmision}" required>
		</p>

		<p>
			<label>Fecha de vencimiento:</label>
			<input type="date" th:field="*{fechaVencimiento}" required>
		</p>

		<p>
			<label>Importe:</label>
			<input type="number" step="0.01" th:field="*{importe}" min="0.01" required>
		</p>

		<!-- El estado por defecto es "pendiente" y los datos de pago se cargan luego, al modificar la factura -->

		<button type="submit">Guardar</button>
		<a href="/facturas/listado" th:href="@{/facturas/listado}" class="boton">Volver</a>

	</form>

</div>

</body>
</html>
