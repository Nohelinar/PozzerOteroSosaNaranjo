<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Listado de Facturas</title>
</head>

<body>

	<p th:if="${error}" th:text="${error}"></p>

	<h1>Listado de Facturas</h1>

	<a th:href="@{/}">Inicio</a>

	<form th:action="@{/facturas/listado}" method="get">
		<select name="estado">
			<option value="">Todos</option>
			<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoFactura).values()}" th:value="${e}"
				th:text="${e}" th:selected="${e == estado}"></option>
		</select>
		<select name="contratoId">
			<option value="" th:selected="${contratoId == null}">Todos</option>
			<option th:each="c : ${contratos}" th:value="${c.id}"
				th:text="${c.propiedad.direccion + ' - ' + c.inquilino.nombre}" th:selected="${c.id == contratoId}">
			</option>
		</select>
		<input type="date" name="vencimientoDesde" th:value="${vencimientoDesde}" />
		<input type="date" name="vencimientoHasta" th:value="${vencimientoHasta}" />
		<button type="submit">Filtrar</button>
	</form>

	<table border="1">
		<thead>
			<tr>
				<th>Id</th>
				<th>Contrato</th>
				<th>Propiedad</th>
				<th>Inquilino</th>
				<th>Fecha Emisión</th>
				<th>Fecha Vencimiento</th>
				<th>Importe</th>
				<th>Estado</th>
				<th>Acciones</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="factura : ${facturas}">
				<td th:text="${factura.id}"></td>
				<td th:text="${factura.contrato.id}"></td>
				<td th:text="${factura.contrato.propiedad.direccion}"></td>
				<td th:text="${factura.contrato.inquilino.nombre}"></td>
				<td th:text="${factura.fechaEmision}"></td>
				<td th:text="${factura.fechaVencimiento}"></td>
				<td th:text="${factura.importe}"></td>
				<td th:text="${factura.estado}"></td>
				<td>
					<a th:href="@{/facturas/editar/{id}(id=${factura.id})}">Editar</a>

					<form th:action="@{/facturas/eliminar/{id}(id=${factura.id})}" method="post" style="display:inline">
						<button type="submit">Eliminar</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>

</html>
