<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Facturas</title>
	<link rel="stylesheet" href="/css/main.css" th:href="@{/css/main.css}">
</head>

<body>

<div class="contenedor">

	<h1>Facturas</h1>

	<a th:href="@{/}" class="boton">Inicio</a>

	<div th:if="${error}" class="mensaje-error">
		<span th:text="${error}"></span>
	</div>

	<form th:action="@{/facturas/listado}" method="get">

		<div>
			<label>Estado</label>
			<select name="estado">
				<option value="">Todos</option>
				<option th:each="e : ${T(com.tuti.desi.pozzeroterososanaranjo.enums.EstadoFactura).values()}"
						th:value="${e}"
						th:text="${e}"
						th:selected="${e == estado}">
				</option>
			</select>
		</div>

		<div>
			<label>Contrato</label>
			<select name="contratoId">
				<option value="" th:selected="${contratoId == null}">Todos</option>
				<option th:each="c : ${contratos}"
						th:value="${c.id}"
						th:text="${c.propiedad.direccion + ' - ' + c.inquilino.nombre}"
						th:selected="${c.id == contratoId}">
				</option>
			</select>
		</div>

		<div>
			<label>Vencimiento Desde</label>
			<input type="date" name="vencimientoDesde" th:value="${vencimientoDesde}" />
		</div>

		<div>
			<label>Vencimiento Hasta</label>
			<input type="date" name="vencimientoHasta" th:value="${vencimientoHasta}" />
		</div>

		<button type="submit">Filtrar</button>
		<a th:href="@{/facturas/listado}" class="boton">Cancelar</a>

	</form>

	<table>
		<thead>
		<tr>
			<th>Id</th>
			<th>Contrato</th>
			<th>Propiedad</th>
			<th>Inquilino</th>
			<th>Fecha Emisión</th>
			<th>Fecha Vencimiento</th>
			<th>Importe</th>
			<th>Estado</th>
			<th></th>
			<th></th>
		</tr>
		</thead>

		<tbody>
		<tr th:each="factura : ${facturas}">
			<td th:text="${factura.id}"></td>
			<td th:text="${factura.contrato.id}"></td>
			<td th:text="${factura.contrato.propiedad.direccion}"></td>
			<td th:text="${factura.contrato.inquilino.nombre}"></td>
			<td th:text="${factura.fechaEmision}"></td>
			<td th:text="${factura.fechaVencimiento}"></td>
			<td th:text="${factura.importe}"></td>
			<td th:text="${factura.estado}"></td>

			<td>
				<a th:href="@{/facturas/editar/{id}(id=${factura.id})}" class="boton">Editar</a>
			</td>

			<td>
				<form th:action="@{/facturas/eliminar/{id}(id=${factura.id})}"
					  method="post"
					  onsubmit="return confirm('¿Confirma la eliminación de la factura?');">
					<button type="submit">Eliminar</button>
				</form>
			</td>

		</tr>
		</tbody>
	</table>

	<p th:if="${facturas == null or facturas.isEmpty()}">
		No se encontraron facturas.
	</p>

</div>

</body>
</html>
